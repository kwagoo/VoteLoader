name: Windows executable

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, such as v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check the release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v') {
            Write-Error "The release tag must start with v."
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build VoteLoader.exe
        run: npm run build:exe

      - name: Confirm the executable is present and .env was not packed
        shell: pwsh
        run: |
          if (Test-Path .env) {
            Write-Error ".env is present in CI and must not be baked into the executable."
            exit 1
          }
          if (-not (Test-Path dist/VoteLoader.exe)) {
            Write-Error "dist/VoteLoader.exe was not created."
            exit 1
          }

      - name: Smoke test VoteLoader.exe serves pages
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'voteloader-smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item dist/VoteLoader.exe (Join-Path $dir 'VoteLoader.exe')
          @(
            'PORT=3456'
            'COOKIE_SECRET=smoke-test-secret'
            'SALESFORCE_CLIENT_ID=smoke'
            'SALESFORCE_CLIENT_SECRET=smoke'
            'SALESFORCE_REDIRECT_URI=http://localhost:3456/api/org/salesforce/callback'
            'SALESFORCE_LOGIN_URL=https://login.salesforce.com'
            'VOTELOADER_NO_BROWSER=1'
          ) | Set-Content -Path (Join-Path $dir '.env') -Encoding ascii
          $stdout = Join-Path $dir 'stdout.txt'
          $stderr = Join-Path $dir 'stderr.txt'
          $proc = Start-Process -FilePath (Join-Path $dir 'VoteLoader.exe') -WorkingDirectory $dir -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $ok = $false
          $homePage = ''
          try {
            for ($i = 0; $i -lt 45; $i++) {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-WebRequest -Uri 'http://localhost:3456/' -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200 -and $resp.Content -match 'Salesforce ballot loader') {
                  $homePage = $resp.Content
                  $ok = $true
                  break
                }
              } catch {}
            }
            if (-not $ok) {
              Write-Host '--- stdout ---'
              if (Test-Path $stdout) { Get-Content $stdout -Raw }
              Write-Host '--- stderr ---'
              if (Test-Path $stderr) { Get-Content $stderr -Raw }
              Write-Error 'VoteLoader.exe did not serve /.'
              exit 1
            }
            $css = Invoke-WebRequest -Uri 'http://localhost:3456/styles.css' -UseBasicParsing -TimeoutSec 5
            $js = Invoke-WebRequest -Uri 'http://localhost:3456/app.js' -UseBasicParsing -TimeoutSec 5
            if ($css.StatusCode -ne 200 -or $css.Content -notmatch 'max-width: 880px') {
              Write-Error 'VoteLoader.exe did not serve /styles.css.'
              exit 1
            }
            if ($js.StatusCode -ne 200 -or $js.Content -notmatch 'preferences') {
              Write-Error 'VoteLoader.exe did not serve /app.js.'
              exit 1
            }
            if ($homePage -notmatch 'empty normalised entry') {
              Write-Error 'The home page served by VoteLoader.exe is not the current UI.'
              exit 1
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Attach VoteLoader.exe to the GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: dist/VoteLoader.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
